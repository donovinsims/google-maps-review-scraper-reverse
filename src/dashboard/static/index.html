<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>GMaps Collector</title>
<style>
  body{font-family:system-ui;max-width:720px;margin:2rem auto;padding:0 1rem}
  h4{margin-bottom:.2rem} td,th{border:1px solid #ddd;padding:.3rem .6rem;text-align:left}
  table{border-collapse:collapse;width:100%;font-size:13px} .muted{color:#888;font-size:12px}
</style>
</head>
<body>
<h4>Places collected</h4>
<table id="places"><thead><tr><th>placeId</th><th>Name</th><th>Reviews</th></tr></thead><tbody></tbody></table>
<h4>Recent runs</h4>
<table id="runs"><thead><tr><th>file</th><th>urls</th><th>collected</th><th>terminated</th></tr></thead><tbody></tbody></table>
<p><a href="/api/export/csv">Export all reviews (CSV)</a> · <a href="/api/export/json">Export all (JSON)</a></p>
<div id="detail"></div>
<script>
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

fetch('/api/places').then(r=>r.json()).then(({places})=>{
  const t=document.querySelector('#places tbody');
  for(const p of places){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><a href="#">${esc(p.placeId)}</a></td><td>${esc(p.name??'')}</td><td>${Number(p.reviewCount??0)}</td>`;
    tr.querySelector('a').onclick=async e=>{e.preventDefault();
      const r=await fetch(`/api/places/${encodeURIComponent(p.placeId)}/reviews`).then(x=>x.json());
      document.getElementById('detail').innerHTML=`<h4>${esc(p.name??p.placeId)}</h4><table><thead><tr><th>Reviewer</th><th>Rating</th><th>Date</th><th>Text</th></tr></thead><tbody>`+
        r.reviews.slice(0,50).map(r2=>`<tr><td>${esc(r2.reviewerName??'')}</td><td>${esc(r2.rating??'')}</td><td>${esc(r2.publishedDateRaw??'')}</td><td>${esc((r2.reviewText??'').slice(0,150))}</td></tr>`).join('')+`</tbody></table>`;
    };
    t.appendChild(tr);
  }
});
fetch('/api/jobs').then(r=>r.json()).then(({jobs})=>{
  const t=document.querySelector('#runs tbody');
  for(const j of jobs.slice(0,10)){
    const d=j.data;if(!Array.isArray(d))continue;
    const collected=d.reduce((s,x)=>s+(x.count??0),0);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${esc(j.name)}</td><td>${Number(d.length)}</td><td>${Number(collected)}</td><td>${esc(d.map(x=>x.terminated?.reason??'').join(', '))}</td>`;
    t.appendChild(tr);
  }
});
</script>
</body>
</html>
